<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Pong Game</title>\n    <style>\n        body {\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            height: 100vh;\n            background-color: black;\n            color: white;\n        }\n        canvas {\n            border: 1px solid white;\n        }\n        #scoreboard {\n            position: absolute;\n            top: 10px;\n            font-size: 24px;\n        }\n    </style>\n</head>\n<body>\n    <div id="scoreboard">Player: 0 - AI: 0</div>\n    <canvas id="pong" width="800" height="400"></canvas>\n\n    <script>\n        const canvas = document.getElementById('pong');\n        const context = canvas.getContext('2d');\n\n        // Create the paddle and ball\n        const paddleWidth = 10, paddleHeight = 100;\n        const ballSize = 10;\n        let playerScore = 0, aiScore = 0;\n        let paddleY = (canvas.height - paddleHeight) / 2;\n        let aiPaddleY = (canvas.height - paddleHeight) / 2;\n        let ballX = canvas.width / 2, ballY = canvas.height / 2;\n        let ballSpeedX = 5, ballSpeedY = 5;\n\n        // Control the paddle with the mouse\n        canvas.addEventListener('mousemove', (event) => {\n            const rect = canvas.getBoundingClientRect();\n            const mouseY = event.clientY - rect.top;\n            paddleY = mouseY - paddleHeight / 2;\n        });\n\n        // Control with arrow keys\n        document.addEventListener('keydown', (event) => {\n            if (event.key === 'ArrowUp' && paddleY > 0) paddleY -= 20;\n            if (event.key === 'ArrowDown' && paddleY < canvas.height - paddleHeight) paddleY += 20;\n        });\n\n        // Update game\n        function update() {\n            ballX += ballSpeedX;\n            ballY += ballSpeedY;\n\n            // AI movement\n            if (aiPaddleY + paddleHeight / 2 < ballY) aiPaddleY += 3;\n            else if (aiPaddleY + paddleHeight / 2 > ballY) aiPaddleY -= 3;\n\n            // Ball collision detection\n            if (ballY <= 0 || ballY >= canvas.height) ballSpeedY = -ballSpeedY;\n            if (ballX <= paddleWidth) {\n                if (ballY >= paddleY && ballY <= paddleY + paddleHeight) {\n                    ballSpeedX = -ballSpeedX;\n                } else {\n                    aiScore++;\n                    resetBall();\n                }\n            } else if (ballX >= canvas.width - paddleWidth) {\n                if (ballY >= aiPaddleY && ballY <= aiPaddleY + paddleHeight) {\n                    ballSpeedX = -ballSpeedX;\n                } else {\n                    playerScore++;\n                    resetBall();\n                }\n            }\n\n            // Draw everything\n            draw();\n        }\n\n        function draw() {\n            context.clearRect(0, 0, canvas.width, canvas.height);\n            // Draw paddles\n            context.fillStyle = 'white';\n            context.fillRect(0, paddleY, paddleWidth, paddleHeight);\n            context.fillRect(canvas.width - paddleWidth, aiPaddleY, paddleWidth, paddleHeight);\n            // Draw ball\n            context.beginPath();\n            context.arc(ballX, ballY, ballSize, 0, Math.PI * 2);\n            context.fill();\n            // Update scoreboard\n            document.getElementById('scoreboard').innerText = `Player: ${playerScore} - AI: ${aiScore}`;\n        }\n\n        function resetBall() {\n            ballX = canvas.width / 2;\n            ballY = canvas.height / 2;\n            ballSpeedX = -ballSpeedX;\n        }\n\n        // Main loop\n        function gameLoop() {\n            update();\n            requestAnimationFrame(gameLoop);\n        }\n\n        gameLoop();\n    </script>\n</body>\n</html>
